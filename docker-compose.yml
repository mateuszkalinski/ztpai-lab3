services:
  db:
    image: postgres:16
    container_name: roombooking-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: roombooking
    ports:
      - "5432:5432"
    volumes:
      - roombooking-pgdata:/var/lib/postgresql/data

volumes:
  roombooking-pgdata:
    name: roombooking-pgdata
